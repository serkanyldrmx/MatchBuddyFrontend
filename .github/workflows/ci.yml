name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      # CI ortamında ESLint uyarıları derlemeyi durdurur; yeni uyarı eklenmesini engeller.
      - name: Derleme
        run: npm run build
